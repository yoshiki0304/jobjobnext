name: Tilt hero amount upward

on:
  push:
    paths:
      - '.github/workflows/tilt-hero-amount.yml'

permissions:
  contents: write

jobs:
  tilt-amount:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tilt 100,000 yen slightly upward to the right
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('style.css')
          css = path.read_text(encoding='utf-8')

          old = '.heroOffer>strong{grid-column:1;grid-row:2;font:900 61px/.91 Impact,Haettenschweiler,"Arial Narrow Bold",Arial,sans-serif;letter-spacing:-.025em;white-space:nowrap;background:linear-gradient(180deg,#fffce4 0%,#fff2a0 10%,#ffd43a 26%,#ffb000 48%,#d58700 67%,#6d3900 88%,#ffd957 100%);-webkit-background-clip:text;background-clip:text;color:#eeb317;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.4px #5c3300;filter:drop-shadow(0 1px 0 #fff7c5) drop-shadow(0 3px 0 #754300) drop-shadow(0 6px 6px #001a1066)}'
          new = '.heroOffer>strong{grid-column:1;grid-row:2;font:900 61px/.91 Impact,Haettenschweiler,"Arial Narrow Bold",Arial,sans-serif;letter-spacing:-.025em;white-space:nowrap;background:linear-gradient(180deg,#fffce4 0%,#fff2a0 10%,#ffd43a 26%,#ffb000 48%,#d58700 67%,#6d3900 88%,#ffd957 100%);-webkit-background-clip:text;background-clip:text;color:#eeb317;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.4px #5c3300;filter:drop-shadow(0 1px 0 #fff7c5) drop-shadow(0 3px 0 #754300) drop-shadow(0 6px 6px #001a1066);display:inline-block;transform:rotate(-5deg);transform-origin:left bottom}'

          if new not in css:
              if old not in css:
                  raise SystemExit('Expected casino amount style was not found.')
              css = css.replace(old, new, 1)
              path.write_text(css, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tilt-hero-amount.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/tilt-hero-amount.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Tilt hero 100,000 yen amount upward"
          git push

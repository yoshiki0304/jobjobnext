name: Fix Manga Aspect Ratio
on:
  push:
    paths:
      - '.github/workflows/fix-manga-aspect.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix manga aspect ratio
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          manga = Path('assets/manga.webp')
          with Image.open(manga) as im:
              w, h = im.size

          # Correct the declared intrinsic dimensions to the actual optimized image.
          pat = re.compile(r'(<img\b[^>]*src="\./assets/manga\.webp"[^>]*)(>)', re.I)
          m = pat.search(html)
          if not m:
              raise SystemExit('manga image tag not found')
          tag = m.group(1)
          tag = re.sub(r'\swidth="[^"]*"', '', tag)
          tag = re.sub(r'\sheight="[^"]*"', '', tag)
          tag = tag.rstrip('/')
          tag = f'{tag} width="{w}" height="{h}"'
          html = html[:m.start()] + tag + '>' + html[m.end():]

          marker = '/* manga-aspect-fix */'
          if marker not in html:
              css = '<style>/* manga-aspect-fix */.mangaWrap img{display:block;width:100%!important;height:auto!important;max-width:100%!important;object-fit:contain!important;aspect-ratio:auto!important}</style>'
              html = html.replace('</head>', css + '</head>', 1)

          html_path.write_text(html, encoding='utf-8')
          print(f'manga dimensions: {w}x{h}')
          PY
      - name: Commit fix
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-manga-aspect.yml
          git commit -m "Fix manga image aspect ratio"
          git push origin main

name: Fix LINE OGP
on:
  push:
    paths:
      - '.github/workflows/fix-line-ogp.yml'

permissions:
  contents: write

jobs:
  fix-ogp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create 1200x630 OGP image
        run: |
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/ogp-sumikomi-job.jpg")
          dst = Path("assets/ogp-sumikomi-job-20260928.jpg")

          im = Image.open(src).convert("RGB")
          im = im.resize((1200, 630), Image.Resampling.LANCZOS)
          im.save(dst, "JPEG", quality=92, optimize=True, progressive=False)

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          import re
          patterns = [
              r'<meta property="og:image"[^>]*>',
              r'<meta property="og:image:secure_url"[^>]*>',
              r'<meta property="og:image:type"[^>]*>',
              r'<meta property="og:image:width"[^>]*>',
              r'<meta property="og:image:height"[^>]*>',
              r'<meta name="twitter:card"[^>]*>',
              r'<meta name="twitter:image"[^>]*>',
          ]
          for pat in patterns:
              s = re.sub(pat, "", s)

          marker = '<meta property="og:description" content="住み込みの仕事探しなら住み込みJOB。入社祝い金あり、寮付き・未経験歓迎など全国の求人をご紹介。"/>'
          tags = (
              marker
              + '<meta property="og:image" content="https://raw.githubusercontent.com/yoshiki0304/jobjobnext/main/assets/ogp-sumikomi-job-20260928.jpg"/>'
              + '<meta name="twitter:card" content="summary_large_image"/>'
              + '<meta name="twitter:image" content="https://raw.githubusercontent.com/yoshiki0304/jobjobnext/main/assets/ogp-sumikomi-job-20260928.jpg"/>'
          )
          if marker not in s:
              raise SystemExit("OG description marker not found")
          s = s.replace(marker, tags, 1)
          p.write_text(s, encoding="utf-8")

          # Verify output before committing.
          check = Image.open(dst)
          assert check.size == (1200, 630), check.size
          print("OGP image:", check.size, dst.stat().st_size, "bytes")
          PY

      - name: Commit fixed OGP
        run: |
          rm -f .github/workflows/fix-line-ogp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix LINE OGP image and metadata"
          git push

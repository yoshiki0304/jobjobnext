name: Add footer company info

on:
  push:
    paths:
      - '.github/workflows/add-footer-company-info.yml'

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add company information to footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          old = '<p><b>電話番号</b><br/><a href="tel:0926003558">092-600-3558</a></p><small>© はたらくナビすぐワーク All Rights Reserved.</small>'
          new = '<p><b>電話番号</b><br/><a href="tel:0926003558">092-600-3558</a></p><p><b>運営会社</b><br/>株式会社Next Japan Innovation</p><p><b>許可番号</b><br/>40-ユ-301761</p><small>© はたらくナビすぐワーク All Rights Reserved.</small>'

          if '40-ユ-301761' not in html:
              if old not in html:
                  raise SystemExit('Expected footer block was not found.')
              html = html.replace(old, new, 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-footer-company-info.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-footer-company-info.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add operator and license number to footer"
          git push

name: Optimize PageSpeed Round 2
on:
  push:
    paths:
      - '.github/workflows/pagespeed-round2.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image tools
        run: python3 -m pip install --quiet pillow
      - name: Further optimize assets and critical rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          # Downscale WebP assets to the maximum size actually useful for this 520px LP canvas.
          limits = {
            'assets/hero-reference-pink-brown.webp': 1040,
            'assets/manga.webp': 1040,
            'assets/job-manufacturing.webp': 840,
            'assets/job-inspection.webp': 840,
            'assets/job-operator.webp': 840,
            'assets/job-forklift.webp': 840,
            'assets/support-phone.webp': 840,
            'assets/support-travel.webp': 840,
            'assets/support-room.webp': 840,
            'assets/support-pay.webp': 840,
            'assets/support-advisor.webp': 840,
            'assets/support-meal-bento.webp': 840,
            'assets/brand-logo.webp': 256,
            'assets/line-logo.webp': 96,
            'assets/yen-10000-front.webp': 320,
          }
          for name, max_w in limits.items():
            p = Path(name)
            if not p.exists():
              continue
            with Image.open(p) as im:
              if im.width > max_w:
                new_h = round(im.height * max_w / im.width)
                im = im.resize((max_w, new_h), Image.Resampling.LANCZOS)
              if im.mode not in ('RGB','RGBA'):
                im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              q = 80 if ('hero-reference' in name or 'manga' in name or 'brand-logo' in name) else 76
              im.save(p, 'WEBP', quality=q, method=6)

          html_path = Path('index.html')
          css_path = Path('style.css')
          html = html_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          # Inline CSS to remove the stylesheet render-blocking request.
          html = re.sub(r'<link rel="stylesheet" href="\.\/style\.css">', '<style>'+css+'</style>', html, count=1)

          # Update explicit dimensions after downscaling.
          def refresh_dims(m):
            tag = m.group(0)
            sm = re.search(r'src="([^"]+)"', tag)
            if not sm or not sm.group(1).startswith('./'):
              return tag
            fs = Path(sm.group(1)[2:])
            if not fs.exists():
              return tag
            try:
              with Image.open(fs) as im:
                w,h = im.size
            except Exception:
              return tag
            tag = re.sub(r'\swidth="\d+"', '', tag)
            tag = re.sub(r'\sheight="\d+"', '', tag)
            return tag[:-1] + f' width="{w}" height="{h}">'
          html = re.sub(r'<img\b[^>]*>', refresh_dims, html, flags=re.I)

          # Reduce initial layout/paint work for below-the-fold sections.
          html = html.replace('</head>', '<style>@media(max-width:980px){.lifeSection,.dormSection,.jobsSection,.worrySection,.mangaSection,.detailSupport,.trustSection,.middleCta,.flowSection,.faqSection,.finalCta,footer{content-visibility:auto;contain-intrinsic-size:700px}}</style></head>', 1)

          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit optimized site
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/*.webp
          git rm .github/workflows/pagespeed-round2.yml
          git commit -m "Further optimize PageSpeed rendering and images"
          git push origin main

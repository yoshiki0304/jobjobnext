name: Optimize PageSpeed
on:
  push:
    paths:
      - '.github/workflows/pagespeed-optimize.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image tools
        run: python3 -m pip install --quiet pillow
      - name: Optimize images and markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          pairs = {
            'assets/hero-reference-pink-brown.png': 'assets/hero-reference-pink-brown.webp',
            'assets/job-manufacturing.png': 'assets/job-manufacturing.webp',
            'assets/job-inspection.png': 'assets/job-inspection.webp',
            'assets/job-operator.png': 'assets/job-operator.webp',
            'assets/job-forklift.png': 'assets/job-forklift.webp',
            'assets/support-phone.png': 'assets/support-phone.webp',
            'assets/support-travel.png': 'assets/support-travel.webp',
            'assets/support-room.png': 'assets/support-room.webp',
            'assets/support-pay.png': 'assets/support-pay.webp',
            'assets/support-advisor.png': 'assets/support-advisor.webp',
            'assets/manga.png': 'assets/manga.webp',
            'assets/brand-logo.png': 'assets/brand-logo.webp',
            'assets/line-logo.png': 'assets/line-logo.webp',
            'assets/yen-10000-front.png': 'assets/yen-10000-front.webp',
          }

          for src, dst in pairs.items():
            p = Path(src)
            if not p.exists():
              continue
            with Image.open(p) as im:
              # Preserve alpha where present, otherwise encode RGB.
              if im.mode not in ('RGB', 'RGBA'):
                im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              quality = 82 if ('hero-reference' in src or 'manga' in src or 'brand-logo' in src) else 78
              im.save(dst, 'WEBP', quality=quality, method=6)

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          for src, dst in pairs.items():
            html = html.replace('./' + src, './' + dst)

          # Add explicit dimensions and modern loading hints to local images.
          img_re = re.compile(r'<img\b[^>]*>', re.I)
          def tune_img(m):
            tag = m.group(0)
            sm = re.search(r'src="([^"]+)"', tag)
            if not sm:
              return tag
            src = sm.group(1)
            if not src.startswith('./'):
              return tag
            fs = Path(src[2:])
            if fs.exists() and 'width=' not in tag and 'height=' not in tag:
              try:
                with Image.open(fs) as im:
                  w, h = im.size
                tag = tag[:-1] + f' width="{w}" height="{h}">'
              except Exception:
                pass
            if 'decoding=' not in tag:
              tag = tag[:-1] + ' decoding="async">'
            is_hero = 'heroImage' in tag
            is_above_fold = is_hero or 'brandLogo' in tag or 'headerLine' in tag
            if is_hero:
              if 'loading=' not in tag:
                tag = tag[:-1] + ' loading="eager">'
              if 'fetchpriority=' not in tag:
                tag = tag[:-1] + ' fetchpriority="high">'
            elif not is_above_fold and 'loading=' not in tag:
              tag = tag[:-1] + ' loading="lazy">'
            return tag
          html = img_re.sub(tune_img, html)
          html_path.write_text(html, encoding='utf-8')

          # Disable the expensive canvas bubble loop on mobile, where the bubble layer is hidden anyway.
          bubble_path = Path('assets/bubbles-static.js')
          bubble = bubble_path.read_text(encoding='utf-8')
          needle = '(() => {\n  const host = document.querySelector(".bubbleBackground");'
          repl = '(() => {\n  if (window.matchMedia("(max-width: 980px)").matches) return;\n  const host = document.querySelector(".bubbleBackground");'
          if needle in bubble and 'max-width: 980px' not in bubble:
            bubble = bubble.replace(needle, repl, 1)
          bubble_path.write_text(bubble, encoding='utf-8')

          # Make the money-rain animation compositor-friendly: transform only, no animated top property.
          css_path = Path('style.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('will-change:top,transform;animation:moneyRainFall', 'will-change:transform;animation:moneyRainFall')
          css = re.sub(
            r'@keyframes moneyRainFall\{0%\{top:-65px;transform:translate3d\(0,-20px,0\) rotate\(var\(--tilt\)\)\}25%\{transform:translate3d\(var\(--sway\),0,0\) rotate\(7deg\)\}50%\{transform:translate3d\(var\(--sway-end\),0,0\) rotate\(-9deg\)\}75%\{transform:translate3d\(var\(--sway\),0,0\) rotate\(13deg\)\}100%\{top:calc\(100% \+ 65px\);transform:translate3d\(var\(--sway-end\),30px,0\) rotate\(var\(--spin\)\)\}\}',
            '@keyframes moneyRainFall{0%{transform:translate3d(0,-20px,0) rotate(var(--tilt))}25%{transform:translate3d(var(--sway),550px,0) rotate(7deg)}50%{transform:translate3d(var(--sway-end),1100px,0) rotate(-9deg)}75%{transform:translate3d(var(--sway),1650px,0) rotate(13deg)}100%{transform:translate3d(var(--sway-end),2200px,0) rotate(var(--spin))}}',
            css,
            count=1
          )
          css = css.replace('url("./assets/yen-10000-front.png")', 'url("./assets/yen-10000-front.webp")')
          css = css.replace('filter:blur(.2px);transform:translate3d(0,-24%,0)', 'transform:translate3d(0,-24%,0)')
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit optimized site
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css assets/bubbles-static.js assets/*.webp
          git rm .github/workflows/pagespeed-optimize.yml
          git commit -m "Optimize mobile PageSpeed performance"
          git push origin main

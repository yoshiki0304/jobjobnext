name: Upgrade hero offer to casino style

on:
  push:
    paths:
      - '.github/workflows/casino-hero-offer.yml'

permissions:
  contents: write

jobs:
  update-casino-offer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply casino-style hero offer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('style.css')
          css = path.read_text(encoding='utf-8')
          start = '/* CASINO HERO OFFER START */'
          end = '/* CASINO HERO OFFER END */'
          block = r'''
/* CASINO HERO OFFER START */
.heroOffer{
  left:16px;
  top:38px;
  width:340px;
  max-width:calc(100% - 32px);
  height:132px;
  padding:12px 16px 10px;
  grid-template-columns:auto 1fr;
  grid-template-rows:27px 76px 14px;
  align-items:end;
  overflow:hidden;
  clip-path:none;
  border:3px solid #d7a50b;
  border-radius:7px;
  background:
    radial-gradient(circle at 50% -20%,#3cff9b4d 0 23%,transparent 46%),
    radial-gradient(circle at 12% 20%,#ffe57b2e 0 2%,transparent 4%),
    radial-gradient(circle at 86% 28%,#fff7b13d 0 2%,transparent 4%),
    linear-gradient(145deg,#031d12 0%,#064629 32%,#078b47 58%,#032619 100%);
  box-shadow:
    0 11px 24px #001b124f,
    0 0 0 2px #fff0a45c inset,
    0 0 19px #f8ca3d45,
    0 -15px 32px #1ee87b1f inset;
  text-shadow:none;
  isolation:isolate;
  animation:supportMoneyPulse 1.6s ease-in-out infinite,casinoOfferGlow 3.2s ease-in-out infinite;
}
.heroOffer:before{
  content:"";
  position:absolute;
  inset:5px;
  z-index:0;
  clip-path:none;
  border:1px solid #ffe58c;
  border-radius:4px;
  background:
    linear-gradient(90deg,#8b5a00,#fff2a3 18%,#c78a00 42%,#fff0a1 60%,#936100 100%) top/100% 2px no-repeat,
    linear-gradient(90deg,#8b5a00,#fff2a3 18%,#c78a00 42%,#fff0a1 60%,#936100 100%) bottom/100% 2px no-repeat;
  filter:none;
  box-shadow:none;
  pointer-events:none;
}
.heroOffer:after{
  content:"";
  position:absolute;
  inset:-30%;
  z-index:1;
  clip-path:none;
  background:
    radial-gradient(circle at 17% 24%,#fff 0 1px,#fff1a3 2px,transparent 5px),
    radial-gradient(circle at 82% 18%,#fff 0 1px,#ffe375 2px,transparent 5px),
    radial-gradient(circle at 72% 76%,#fff 0 1px,#ffd84a 2px,transparent 5px),
    linear-gradient(110deg,transparent 35%,#fff8c900 43%,#fff9cf9c 49%,#fff 50%,#fff4ad91 51%,transparent 58%);
  box-shadow:none;
  opacity:.72;
  transform:translateX(-75%);
  animation:casinoOfferShine 3.8s ease-in-out infinite;
  pointer-events:none;
}
.heroOffer>span,.heroOffer>strong,.heroOffer>b,.heroOffer>i{position:relative;z-index:2}
.heroOffer>span{
  grid-column:1/3;
  font-size:20px;
  line-height:1;
  font-weight:900;
  letter-spacing:.04em;
  color:#fff;
  white-space:nowrap;
  text-shadow:0 2px 0 #06451f,0 0 8px #fff3a359;
}
.heroOffer>span:after{
  content:"✦";
  margin-left:7px;
  color:#fff6a0;
  font-size:.85em;
  text-shadow:0 0 9px #fff,0 0 15px #ffd12c;
}
.heroOffer>span em{
  display:inline-block;
  margin-left:10px;
  padding:3px 10px 4px;
  border:1px solid #ffe792;
  border-radius:2px;
  background:linear-gradient(180deg,#175d37,#07351f);
  color:#ffe88a;
  font-size:.72em;
  font-style:normal;
  letter-spacing:.06em;
  box-shadow:0 2px 0 #6f4700,0 0 8px #ffd95533 inset;
  text-shadow:0 1px 0 #594000;
}
.heroOffer>strong{
  grid-column:1;
  grid-row:2;
  font:900 61px/.91 Impact,Haettenschweiler,"Arial Narrow Bold",Arial,sans-serif;
  letter-spacing:-.025em;
  white-space:nowrap;
  background:linear-gradient(180deg,#fffce4 0%,#fff2a0 10%,#ffd43a 26%,#ffb000 48%,#d58700 67%,#6d3900 88%,#ffd957 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:#eeb317;
  -webkit-text-fill-color:transparent;
  -webkit-text-stroke:1.4px #5c3300;
  filter:drop-shadow(0 1px 0 #fff7c5) drop-shadow(0 3px 0 #754300) drop-shadow(0 6px 6px #001a1066);
}
.heroOffer>strong small{
  font:900 18px "Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
  margin-left:2px;
  background:linear-gradient(180deg,#fffbd7 0%,#ffd83d 52%,#9b5e00 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:#efb31a;
  -webkit-text-fill-color:transparent;
  -webkit-text-stroke:.7px #5b3600;
}
.heroOffer>b{
  grid-column:2;
  grid-row:2;
  align-self:end;
  padding:0 0 13px 7px;
  font-size:21px;
  line-height:1;
  color:#fff;
  white-space:nowrap;
  -webkit-text-stroke:.25px #553600;
  text-shadow:0 2px 0 #6e4700,0 0 8px #fff2a477,0 4px 8px #00170d80;
}
.heroOffer>i{
  grid-column:1/3;
  grid-row:3;
  justify-self:center;
  margin:0;
  padding:1px 10px 2px;
  border-left:1px solid #dcae3a;
  border-right:1px solid #dcae3a;
  font-style:normal;
  font-size:7px;
  color:#fff5c9;
  letter-spacing:.03em;
  background:#001b1066;
  text-shadow:0 1px 2px #000;
}
@keyframes casinoOfferGlow{
  0%,100%{box-shadow:0 11px 24px #001b124f,0 0 0 2px #fff0a45c inset,0 0 13px #f8ca3d38,0 -15px 32px #1ee87b1f inset}
  50%{box-shadow:0 13px 27px #001b1261,0 0 0 2px #fff5bc85 inset,0 0 26px #ffd64c75,0 -15px 36px #36f58c2e inset}
}
@keyframes casinoOfferShine{
  0%,64%{transform:translateX(-78%);opacity:0}
  68%{opacity:.9}
  84%{transform:translateX(78%);opacity:.72}
  88%,100%{transform:translateX(78%);opacity:0}
}
@media(max-width:519px){
  .heroOffer{
    top:34px;
    left:12px;
    width:68vw;
    max-width:340px;
    height:clamp(102px,25vw,132px);
    padding:clamp(8px,2.2vw,12px) clamp(10px,3vw,16px) clamp(7px,2vw,10px);
    grid-template-rows:clamp(20px,5.2vw,27px) 1fr clamp(10px,2.7vw,14px);
  }
  .heroOffer>span{font-size:clamp(14px,4vw,20px)}
  .heroOffer>span em{margin-left:clamp(5px,2vw,10px);padding:2px clamp(5px,2vw,10px) 3px;font-size:.68em}
  .heroOffer>strong{font-size:clamp(40px,12vw,61px)}
  .heroOffer>strong small{font-size:clamp(12px,3.6vw,18px)}
  .heroOffer>b{font-size:clamp(13px,4vw,21px);padding-left:4px;padding-bottom:clamp(8px,2.6vw,13px)}
  .heroOffer>i{font-size:clamp(5px,1.45vw,7px);padding-left:5px;padding-right:5px}
}
/* CASINO HERO OFFER END */
'''

          if start in css and end in css:
              css = re.sub(re.escape(start) + r'.*?' + re.escape(end), block.strip(), css, flags=re.S)
          else:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'
          path.write_text(css, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/casino-hero-offer.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/casino-hero-offer.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Upgrade hero support offer to casino style"
          git push

name: Upgrade hero offer to casino style

on:
  push:
    paths:
      - '.github/workflows/casino-hero-offer.yml'

permissions:
  contents: write

jobs:
  update-casino-offer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply casino-style hero offer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          path = Path('style.css')
          css = path.read_text(encoding='utf-8')
          start = '/* CASINO HERO OFFER START */'
          end = '/* CASINO HERO OFFER END */'
          block = base64.b64decode('').decode('utf-8')
          if start in css and end in css:
              pattern = re.escape(start) + r'.*?' + re.escape(end)
              css = re.sub(pattern, block.strip(), css, flags=re.S)
          else:
              css = css.rstrip() + '\n\n' + block.strip() + '\n'
          path.write_text(css, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/casino-hero-offer.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/casino-hero-offer.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Upgrade hero support offer to casino style"
          git push

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>はたらくナビすぐワーク｜LPマンガ挿入版</title>
  <meta name="description" content="はたらくナビすぐワークの承認済みデザインに、5つの支援の上へマンガを挿入した細長いLPです。">
  <meta name="theme-color" content="#0b4ea2">
  <style>
    :root{--bg:#eef3f9;--card:#fff;--shadow:0 20px 60px rgba(0,35,88,.16);--phone:#ff8b10;--line:#15c43f;--radius:22px}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#16314f}
    img{display:block;max-width:100%} a{text-decoration:none;color:inherit}
    .page{width:min(100%,440px);margin:0 auto;padding:10px 8px 94px}
    .lp-wrap{position:relative;line-height:0;background:var(--card);box-shadow:var(--shadow);border-radius:22px;overflow:hidden}
    .lp-image{width:100%;height:auto;display:block}
    .hotspot{position:absolute;display:block;z-index:3}
    /* updated CTA positions after manga insertion */
    .hotspot--line{left:50.0%;top:79.2%;width:43.0%;height:4.0%;border-radius:16px}
    .hotspot--phone{left:50.0%;top:83.1%;width:43.0%;height:3.8%;border-radius:16px}
    .fixed-cta{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:min(calc(100% - 12px),440px);display:grid;grid-template-columns:1fr 1.15fr;gap:8px;padding:8px;background:rgba(255,255,255,.94);border-radius:18px;box-shadow:0 14px 32px rgba(0,31,74,.22);backdrop-filter:blur(12px);z-index:20}
    .fixed-cta a{min-height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.35;padding:8px 10px;font-size:14px}
    .fixed-cta__phone{background:var(--phone);color:#fff}.fixed-cta__line{background:var(--line);color:#fff}
    @media (max-width:420px){.page{padding:8px 6px 90px}.fixed-cta{width:calc(100% - 8px);bottom:4px}.fixed-cta a{min-height:52px;font-size:13px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="lp-wrap" aria-label="はたらくナビすぐワーク ランディングページ マンガ挿入版">
      <img class="lp-image" src="assets/lp-design.png" alt="はたらくナビすぐワークのランディングページ。5つの支援の上にマンガを挿入した版。">
      <a class="hotspot hotspot--line" href="#" aria-label="LINEで無料相談"></a>
      <a class="hotspot hotspot--phone" href="tel:0926003558" aria-label="092-600-3558に電話する"></a>
    </section>
  </main>
  <div class="fixed-cta" aria-label="固定相談ボタン">
    <a class="fixed-cta__phone" href="tel:0926003558">電話で相談<br>092-600-3558</a>
    <a class="fixed-cta__line" href="#">LINEで無料相談</a>
  </div>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>はたらくナビすぐワーク｜生活支援金キャンペーン</title>
  <meta name="description" content="はたらくナビすぐワークのランディングページです。生活支援金キャンペーン、LINE無料相談、電話相談をご案内しています。">
  <meta name="theme-color" content="#0b4ea2">
  <style>
    :root{
      --bg:#f3f6fb;
      --shadow:0 20px 60px rgba(0,35,88,.12);
      --radius:18px;
      --phone:#ff8b10;
      --line:#15c43f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#16314f}
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}
    .page{max-width:1024px;margin:0 auto;padding:0}
    .lp-wrap{position:relative;line-height:0;background:#fff;box-shadow:var(--shadow)}
    .lp-image{width:100%;height:auto;display:block}
    .hotspot{position:absolute;display:block;z-index:3}
    /* main CTA areas based on the approved design image */
    .hotspot--line{left:50.0%;top:59.6%;width:43.0%;height:7.7%;border-radius:16px}
    .hotspot--phone{left:50.0%;top:67.2%;width:43.0%;height:7.2%;border-radius:16px}
    .fixed-cta{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(100% - 16px, 760px);display:grid;grid-template-columns:1fr 1.2fr;gap:8px;padding:8px;background:rgba(255,255,255,.94);border-radius:18px;box-shadow:0 12px 30px rgba(0,31,74,.2);backdrop-filter:blur(12px);z-index:20}
    .fixed-cta a{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800}
    .fixed-cta__phone{background:var(--phone);color:#fff}
    .fixed-cta__line{background:var(--line);color:#fff}
    .footer-space{height:88px}
    @media (min-width: 900px){
      .page{padding:0}
      .lp-wrap{border-radius:0;overflow:hidden}
    }
    @media (max-width: 640px){
      .fixed-cta{width:calc(100% - 12px);bottom:6px}
      .fixed-cta a{height:52px;font-size:.95rem}
      .footer-space{height:84px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="lp-wrap" aria-label="はたらくナビすぐワーク ランディングページ">
      <img class="lp-image" src="assets/lp-design.png" alt="はたらくナビすぐワークのランディングページ">
      <a class="hotspot hotspot--line" href="#" aria-label="LINEで無料相談"></a>
      <a class="hotspot hotspot--phone" href="tel:0926003558" aria-label="092-600-3558に電話する"></a>
    </section>
    <div class="footer-space" aria-hidden="true"></div>
  </main>

  <div class="fixed-cta" aria-label="固定相談ボタン">
    <a class="fixed-cta__phone" href="tel:0926003558">電話で相談 092-600-3558</a>
    <a class="fixed-cta__line" href="#">LINEで無料相談</a>
  </div>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>はたらくナビすぐワーク｜5つの支援 横スクロール版</title>
  <meta name="description" content="はたらくナビすぐワークのLPです。マンガの下にある5つの支援を、縦幅を長めにした横スクロール形式で表示しています。">
  <meta name="theme-color" content="#0b4ea2">
  <style>
    :root{--bg:#eef3f9;--card:#fff;--shadow:0 20px 60px rgba(0,35,88,.16);--phone:#ff8b10;--line:#15c43f;--radius:22px;--blue:#13479d;--text:#1f2f45}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--text)}
    img{display:block;max-width:100%} a{text-decoration:none;color:inherit}
    .page{width:min(100%,440px);margin:0 auto;padding:8px 6px 90px}
    .panel{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
    .top-image,.bottom-image{width:100%;height:auto;display:block}
    .support-scroller-wrap{background:#f9fafc;padding:18px 0 16px}
    .support-scroller{display:flex;gap:14px;overflow-x:auto;padding:0 14px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
    .support-scroller::-webkit-scrollbar{height:8px}
    .support-scroller::-webkit-scrollbar-thumb{background:#b6c8e7;border-radius:999px}
    .support-card{flex:0 0 82%;scroll-snap-align:start;background:#fff;border:1px solid #dde4ef;border-radius:20px;min-height:366px;box-shadow:0 8px 20px rgba(0,35,88,.08);overflow:hidden;display:flex;flex-direction:column}
    .support-card__title{font-size:1.85rem;line-height:1.25;font-weight:800;color:#173f92;text-align:center;padding:18px 14px 10px;min-height:104px;display:flex;align-items:center;justify-content:center}
    .support-card__img{padding:0 14px}
    .support-card__img img{width:100%;aspect-ratio:1.36/1;object-fit:cover;border-radius:16px}
    .support-card__text{padding:18px 18px 22px;font-size:1.3rem;line-height:1.55;text-align:center;color:#333;flex:1;display:flex;align-items:center;justify-content:center}
    .support-hint{padding:0 16px 2px;font-size:12px;font-weight:700;color:#5a6d85;text-align:center}
    .bottom-wrap{position:relative;line-height:0}
    .hotspot{position:absolute;display:block;z-index:3}
    .hotspot--line{left:50.0%;top:6.8%;width:43.0%;height:18.5%;border-radius:16px}
    .hotspot--phone{left:50.0%;top:23.8%;width:43.0%;height:17.2%;border-radius:16px}
    .fixed-cta{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);width:min(calc(100% - 8px),440px);display:grid;grid-template-columns:1fr 1.15fr;gap:8px;padding:8px;background:rgba(255,255,255,.94);border-radius:18px;box-shadow:0 14px 32px rgba(0,31,74,.22);backdrop-filter:blur(12px);z-index:20}
    .fixed-cta a{min-height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.35;padding:8px 10px;font-size:13px}
    .fixed-cta__phone{background:var(--phone);color:#fff}.fixed-cta__line{background:var(--line);color:#fff}
  </style>
</head>
<body>
  <main class="page">
    <div class="panel">
      <img class="top-image" src="assets/top.png" alt="はたらくナビすぐワークのLP上部とマンガ部分">

      <section class="support-scroller-wrap" aria-label="5つの支援 横スクロール">
        <div class="support-scroller">
          <article class="support-card">
            <h3 class="support-card__title">携帯がなくてもOK</h3>
            <div class="support-card__img"><img src="assets/support1.png" alt="携帯がなくてもOK"></div>
            <div class="support-card__text">スマホの貸出で<br>すぐに連絡が取れます</div>
          </article>
          <article class="support-card">
            <h3 class="support-card__title">移動費用サポート</h3>
            <div class="support-card__img"><img src="assets/support2.png" alt="移動費用サポート"></div>
            <div class="support-card__text">面接や入社の際の<br>交通費をサポート</div>
          </article>
          <article class="support-card">
            <h3 class="support-card__title">住む場所を用意</h3>
            <div class="support-card__img"><img src="assets/support3.png" alt="住む場所を用意"></div>
            <div class="support-card__text">寮付きのお仕事多数！<br>初期費用もかかりません</div>
          </article>
          <article class="support-card">
            <h3 class="support-card__title">日払い・週払いOK</h3>
            <div class="support-card__img"><img src="assets/support4.png" alt="日払い・週払いOK"></div>
            <div class="support-card__text">急な出費も安心の<br>日払い・週払い対応</div>
          </article>
          <article class="support-card">
            <h3 class="support-card__title">仕事と住まいの<br>相談サポート</h3>
            <div class="support-card__img"><img src="assets/support5.png" alt="仕事と住まいの相談サポート"></div>
            <div class="support-card__text">専任スタッフが<br>丁寧にサポートします</div>
          </article>
        </div>
        <div class="support-hint">左右にスワイプしてご覧ください</div>
      </section>

      <div class="bottom-wrap">
        <img class="bottom-image" src="assets/bottom.png" alt="LINE相談・電話相談・職業紹介・フッター部分">
        <a class="hotspot hotspot--line" href="#" aria-label="LINEで無料相談"></a>
        <a class="hotspot hotspot--phone" href="tel:0926003558" aria-label="092-600-3558に電話する"></a>
      </div>
    </div>
  </main>

  <div class="fixed-cta" aria-label="固定相談ボタン">
    <a class="fixed-cta__phone" href="tel:0926003558">電話で相談<br>092-600-3558</a>
    <a class="fixed-cta__line" href="#">LINEで無料相談</a>
  </div>
</body>
</html>
